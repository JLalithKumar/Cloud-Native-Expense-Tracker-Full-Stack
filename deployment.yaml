apiVersion: apps/v1
kind: Deployment

metadata:
  name: expense-tracker-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: expense-tracker

  template:
    metadata:
      labels:
        app: expense-tracker

    spec:
      containers:
      - name: expense-tracker

        image: lalithkumarj/expense-tracker:v18

        imagePullPolicy: Always

        ports:
        - containerPort: 8081

        env:
        - name: DB_HOST
          value: mysql
