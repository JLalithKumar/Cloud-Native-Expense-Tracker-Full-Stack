apiVersion: apps/v1
kind: Deployment

metadata:
name: expense-tracker-deployment

spec:
replicas: 2

selector:
matchLabels:
app: expense-tracker

template:
metadata:
labels:
app: expense-tracker

spec:
  containers:
  - name: expense-tracker

    image: lalithkumarj/expense-tracker:v8

    imagePullPolicy: Always

    ports:
    - containerPort: 8081

    env:
    - name: SPRING_DATASOURCE_URL
      value: jdbc:mysql://mysql:3306/expensetracker

    - name: SPRING_DATASOURCE_USERNAME
      value: root

    - name: SPRING_DATASOURCE_PASSWORD
      value: root
